name: Release Fokkus IDE

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # Needed for uploading releases
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install System Dependencies for Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libx11-dev libxkbfile-dev libsecret-1-dev pkg-config

      - name: Install Dependencies
        env:
          NODE_OPTIONS: "--no-experimental-require-module"
        run: yarn install

      - name: Download Plugins
        env:
          NODE_OPTIONS: "--no-experimental-require-module"
        run: yarn download:plugins

      - name: Build Source
        run: yarn build

      - name: Package and Publish Release
        run: yarn package:applications:prod
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
