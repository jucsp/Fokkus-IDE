name: Release Fokkus IDE

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # Needed for uploading releases
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install System Dependencies for Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libx11-dev libxkbfile-dev libsecret-1-dev pkg-config

      - name: Install Dependencies
        run: yarn install

      - name: Patch Theia CLI for Node 22 ESM
        shell: bash
        run: node -e "const fs = require('fs'); const file = 'node_modules/@theia/cli/lib/download-plugins.js'; fs.writeFileSync(file, fs.readFileSync(file, 'utf8').replace('const decompress = require(\"decompress\");', 'const _decompress = require(\"decompress\"); const decompress = _decompress.default || _decompress;'));"

      - name: Download Plugins
        run: yarn download:plugins

      - name: Build Source
        run: yarn build

      - name: Package and Publish Release
        run: yarn package:applications:prod
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            applications/electron/dist/*.exe
            applications/electron/dist/*.AppImage
            applications/electron/dist/*.rpm
            applications/electron/dist/*.deb
            applications/electron/dist/*.tar.gz
            applications/electron/dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
